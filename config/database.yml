# PostgreSQL. Read "Database roles" in README.md before changing this file.
#
# Row-level security only protects data from a role that cannot bypass it (ADR-0004), so every
# database is listed twice:
#
# - The app's entry (primary, cache, queue, cable) connects as footsoldier_app, a role that is
#   not a superuser, owns no tables and has no BYPASSRLS. The app, its console, jobs, seeds and
#   the test suite connect through it. `database_tasks: false` keeps the db: tasks off it.
# - The owner's entry (primary_owner, ...) connects as footsoldier_owner, which owns the database
#   and its tables. Migrations, schema loads and the other db: tasks connect through it, and
#   afterwards grant footsoldier_app read and write access (config/initializers/database_roles.rb).
#
# The two entries of a pair must name the same database. db/roles.sql creates both roles.
#
# Passwords never go in this file: locally the roles need none, or ~/.pgpass holds them, and in
# production they come from the environment. The repository is public.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &app
    <<: *default
    database: footsoldier_development
    username: footsoldier_app
    database_tasks: false
  primary_owner: &owner
    <<: *default
    database: footsoldier_development
    username: footsoldier_owner
    # Without these, Rails would name the schema file after the entry and stop seeding new
    # databases, because this entry is not the primary one.
    schema_dump: schema.rb
    seeds: true

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *app
    database: footsoldier_test
  primary_owner:
    <<: *owner
    database: footsoldier_test

production:
  primary: &primary_production
    <<: *app
    database: footsoldier_production
    password: <%= ENV["FOOTSOLDIER_APP_DATABASE_PASSWORD"] %>
  primary_owner: &primary_owner_production
    <<: *owner
    database: footsoldier_production
    password: <%= ENV["FOOTSOLDIER_OWNER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: footsoldier_production_cache
  cache_owner:
    <<: *primary_owner_production
    database: footsoldier_production_cache
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
    seeds: false
  queue:
    <<: *primary_production
    database: footsoldier_production_queue
  queue_owner:
    <<: *primary_owner_production
    database: footsoldier_production_queue
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
    seeds: false
  cable:
    <<: *primary_production
    database: footsoldier_production_cable
  cable_owner:
    <<: *primary_owner_production
    database: footsoldier_production_cable
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
    seeds: false
