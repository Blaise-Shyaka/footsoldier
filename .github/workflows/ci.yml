name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# The jobs only read the repository. Pull requests from forks get a read-only token anyway;
# this keeps runs on main to the same.
permissions:
  contents: read

# A new push to a pull request makes the run for the previous push pointless. Runs on main
# are never cancelled, so every merge commit gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore the RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Ruby with rubocop-rails-omakase
        run: bin/rubocop -f github

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan the code for Rails vulnerabilities with Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Check the gems for known vulnerabilities with bundler-audit
        run: bin/bundler-audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The oldest PostgreSQL the app supports (doc 02), so tests never rely on a newer
        # server's features.
        image: postgres:17
        # No password: only this job can reach the container, and it is discarded after the
        # run. A password here would look like a leaked credential to secret scanners.
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The tests build the esbuild and Tailwind assets first, which needs Node and the
      # JavaScript packages.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript packages
        run: yarn install --frozen-lockfile

      # test:all runs the unit, integration and system tests. System tests run in the headless
      # Chrome that GitHub's Ubuntu runners include.
      - name: Run the tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres@localhost:5432
        run: bin/rails db:test:prepare test:all

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
